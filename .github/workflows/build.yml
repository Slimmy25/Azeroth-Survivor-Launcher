# Builds the launcher on GitHub's own Windows machines every time you upload changes.
# The finished exe appears under the "Actions" tab (open the run, then "Artifacts").
# It is attached to a release automatically when:
#   - you publish a release (any tag name), or push a tag
#   - you run this workflow by hand (Actions > Build > Run workflow) and type a release's tag name
name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release to attach the exe to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the launcher
        shell: pwsh
        run: |
          # the compiler's messages also become annotations of the run, so a failed build says why
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern "error|Missing file" | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $code
          }

      - name: Keep the exe as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: Azeroth-Survivors-Launcher
          path: |
            dist/Azeroth Survivors Launcher.exe
            dist/Azeroth Survivors Launcher.sha256.txt

      - name: Attach the exe to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          # A push to main publishes the version named at the top of the launcher changelog.
          if [ -z "$TAG" ]; then TAG="$(head -n 1 assets/launcher-changelog.txt | awk '{print $2}')"; fi
          if [ -z "$TAG" ]; then echo "::error::Could not determine the release tag from the launcher changelog"; exit 1; fi
          # each version is its own release, with its notes from release-notes/<tag>.md when there is one
          notes="release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "Azeroth Survivors Launcher $TAG" > /tmp/notes.md; notes=/tmp/notes.md; }
          # a failing command's message becomes an annotation of the run
          run() { "$@" 2>/tmp/err.txt || { echo "::error::$(head -c 900 /tmp/err.txt | tr '\n' ' ')"; exit 1; }; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            run gh release edit "$TAG" --title "Azeroth Survivors Launcher $TAG" --notes-file "$notes"
          else
            run gh release create "$TAG" --title "Azeroth Survivors Launcher $TAG" --notes-file "$notes" --latest
          fi
          # the checksum file, made here too when the build did not leave one
          [ -f "dist/Azeroth Survivors Launcher.sha256.txt" ] || (cd dist && sha256sum "Azeroth Survivors Launcher.exe" > "Azeroth Survivors Launcher.sha256.txt")
          run gh release upload "$TAG" "dist/Azeroth Survivors Launcher.exe" "dist/Azeroth Survivors Launcher.sha256.txt" --clobber

      # Players download from a separate PUBLIC repository that holds only the exe releases, never the code.
      # Needs the secret RELEASES_TOKEN: a fine-grained token with "Contents: Read and write" on that repository.
      - name: Publish the exe on the public downloads repository
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: Slimmy25/Azeroth-Survivor-Launcher-Releases
          TAG: ${{ inputs.release || github.event.release.tag_name || github.ref_name }}
        run: |
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::warning::The RELEASES_TOKEN secret is not set, so nothing was published on $PUBLIC_REPO."
            exit 0
          fi
          # same title and notes as the release here
          title="$(gh release view "$TAG" --json name --jq '.name' 2>/dev/null || true)"
          [ -n "$title" ] || title="$TAG"
          gh release view "$TAG" --json body --jq '.body' > notes.md 2>/dev/null || echo "Azeroth Survivors Launcher $TAG" > notes.md
          [ -s notes.md ] || echo "Azeroth Survivors Launcher $TAG" > notes.md
          export GH_TOKEN="$PUBLIC_TOKEN"
          if gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$PUBLIC_REPO" --title "$title" --notes-file notes.md --latest
          else
            gh release create "$TAG" -R "$PUBLIC_REPO" --title "$title" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" -R "$PUBLIC_REPO" "dist/Azeroth Survivors Launcher.exe" "dist/Azeroth Survivors Launcher.sha256.txt" --clobber
