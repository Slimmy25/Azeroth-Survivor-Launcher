# Builds the launcher on GitHub's own Windows machines every time you upload changes.
# The finished exe appears under the "Actions" tab (open the run, then "Artifacts").
# When you create a release with a tag that starts with v (for example v2.0.1), the exe is attached to it.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the launcher
        shell: cmd
        run: call build.bat

      - name: Keep the exe as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: Azeroth-Survivors-Launcher
          path: |
            dist/Azeroth Survivors Launcher.exe
            dist/Azeroth Survivors Launcher.sha256.txt

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Launcher $GITHUB_REF_NAME" --notes "Azeroth Survivors Launcher $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "dist/Azeroth Survivors Launcher.exe" "dist/Azeroth Survivors Launcher.sha256.txt" --clobber
