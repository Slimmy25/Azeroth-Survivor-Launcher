# Builds the launcher on GitHub's own Windows machines every time you upload changes.
# The finished exe appears under the "Actions" tab (open the run, then "Artifacts").
# It is attached to a release automatically when:
#   - you publish a release (any tag name), or push a tag
#   - you run this workflow by hand (Actions > Build > Run workflow) and type a release's tag name
name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release to attach the exe to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the launcher
        shell: cmd
        run: call build.bat

      - name: Keep the exe as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: Azeroth-Survivors-Launcher
          path: |
            dist/Azeroth Survivors Launcher.exe
            dist/Azeroth Survivors Launcher.sha256.txt

      - name: Attach the exe to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Launcher $TAG" --notes "Azeroth Survivors Launcher $TAG"
          gh release upload "$TAG" "dist/Azeroth Survivors Launcher.exe" "dist/Azeroth Survivors Launcher.sha256.txt" --clobber
