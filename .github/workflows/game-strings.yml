# Developer tool: every readable text in the game (tools/game_strings.py), as a download of the run (kept one day).
name: Game strings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the texts from the game
        run: python3 tools/game_strings.py
      # The texts are the game's own (its code and translations): they are kept as a short-lived download of this run
      # (Actions > the run > Artifacts), never on a branch of this repository
      - name: Keep the result for a day
        uses: actions/upload-artifact@v4
        with:
          name: game-strings
          path: game-strings.txt
          retention-days: 1
