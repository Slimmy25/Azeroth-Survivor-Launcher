# Developer tool: every readable text in the game (tools/game_strings.py), as a download of the run (kept one day).
name: Game strings

on:
  workflow_dispatch:
    inputs:
      find:
        description: "Optional: a pattern (Python regex, case-insensitive); the matching texts are shown as notes on the run"
        required: false
      raw:
        description: "Optional: a pattern searched in every readable text (not only the English ones); each match with its surroundings"
        required: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the texts from the game
        run: python3 tools/game_strings.py
      - name: Show the raw texts that match the raw pattern
        if: inputs.raw != ''
        env:
          RAW: ${{ inputs.raw }}
        run: |
          python3 - <<'PY'
          import os, re
          rx = re.compile(os.environ["RAW"])
          text = open("game-strings.txt", encoding="utf-8").read()
          hits = []
          for m in rx.finditer(text):
              hits.append(m.group(0))
          uniq = sorted(set(hits))
          print("%d matches, %d different" % (len(hits), len(uniq)))
          chunk, n = "", 0
          for l in uniq + [None]:
              if l is None or len(chunk) + len(l) > 3500:
                  if chunk and n < 30:
                      print("::notice::" + chunk.replace("%", "%25").replace("\n", "%0A"))
                      n += 1
                  chunk = ""
              if l is not None:
                  chunk += l + "\n"
          PY
      - name: Show the texts that match the pattern
        if: inputs.find != ''
        env:
          FIND: ${{ inputs.find }}
        run: |
          python3 - <<'PY'
          import json, os, re
          rx = re.compile(os.environ["FIND"], re.I)
          text = open("game-strings.txt", encoding="utf-8").read()
          en, hits = {}, []
          for m in re.finditer(r'"([a-z_]+\.[A-Za-z0-9_.]+)":\s*"((?:[^"\\]|\\.)*)"', text):
              if m.group(1) not in en:   # the first of each key is the English one
                  try:
                      en[m.group(1)] = json.loads('"' + m.group(2) + '"')
                  except Exception:
                      en[m.group(1)] = m.group(2)
          for k, v in en.items():
              if rx.search(k) or rx.search(v):
                  hits.append(k + " = " + v)
          print("%d texts, %d match" % (len(en), len(hits)))
          chunk, n = "", 0
          for l in hits + [None]:
              if l is None or len(chunk) + len(l) > 3500:
                  if chunk and n < 10:
                      print("::notice::" + chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
                      n += 1
                  chunk = ""
              if l is not None:
                  chunk += l[:1500] + "\n"
          PY
      # The texts are the game's own (its code and translations): they are kept as a short-lived download of this run
      # (Actions > the run > Artifacts), never on a branch of this repository
      - name: Keep the result for a day
        uses: actions/upload-artifact@v4
        with:
          name: game-strings
          path: game-strings.txt
          retention-days: 1
