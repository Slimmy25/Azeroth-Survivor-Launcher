# Developer tool: every readable text in the game (tools/game_strings.py), on the "game-strings" branch.
name: Game strings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the texts from the game
        run: python3 tools/game_strings.py
      - name: Keep the result on the game-strings branch
        run: |
          mkdir /tmp/pub && cp game-strings.txt /tmp/pub/ && cd /tmp/pub
          git init -q -b game-strings && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "texts from the game"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:game-strings
