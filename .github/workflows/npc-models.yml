# Developer tool: builds assets/npc-models.txt ("Creature name|model id") from the CMaNGOS Classic world database
# (https://github.com/cmangos/classic-db), so the STATS page's Nemesis can show each creature's model picture from
# Wowhead's image host. Puts the file on the private "npc-models" branch. Run by hand: Actions > NPC models.
name: NPC models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the creatures
        run: |
          git clone -q --depth 1 https://github.com/cmangos/classic-db.git /tmp/db || echo "::error::clone failed"
          echo "::notice::top: $(ls /tmp/db | tr '\n' ' ')"
          echo "::notice::sql files: $(find /tmp/db -iname '*.sql*' -size +1M | head -5 | tr '\n' ' ')"
          f=$(find /tmp/db -iname '*.sql*' -size +1M | head -1)
          case "$f" in
            *.gz) zcat "$f" > /tmp/world.sql ;;
            *.zip) unzip -p "$f" > /tmp/world.sql ;;
            *.7z) 7z x -so "$f" > /tmp/world.sql ;;
            *) cp "$f" /tmp/world.sql ;;
          esac
          echo "::notice::world.sql $(wc -c < /tmp/world.sql) bytes; creature_template lines $(grep -c 'INSERT INTO `creature_template`' /tmp/world.sql)"
          grep -m1 -o 'INSERT INTO `creature_template`.\{0,300\}' /tmp/world.sql | head -c 300 | sed 's/^/::notice::/' || true
          python3 tools/npc_models.py < /tmp/world.sql > /tmp/npc-models.txt || echo "::error::parse failed"
          echo "::notice::creatures: $(wc -l < /tmp/npc-models.txt): $(grep -E '^(Hogger|Scarlet Crusader|Patchwerk)\|' /tmp/npc-models.txt | tr '\n' ' ')"
      - name: Keep it on the npc-models branch
        run: |
          mkdir /tmp/pub && cp /tmp/npc-models.txt /tmp/pub/ && cd /tmp/pub
          git init -q -b npc-models && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "npc models"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:npc-models
