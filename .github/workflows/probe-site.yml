# Developer tool: fetches a few web addresses from a GitHub machine and keeps the answers on the private "site-probe"
# branch (this session's own network cannot reach them). Run by hand: Actions > Probe site > Run workflow.
name: Probe site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir -p /tmp/site && cd /tmp/site
          cat > cands.txt <<'LIST'
          Elwynn Forest|achievement_zone_elwynnforest
          Duskwood|achievement_zone_duskwood
          Warsong Gulch|achievement_bg_captureflag_wsg achievement_bg_winwsg inv_misc_rune_07
          Un'Goro Crater|achievement_zone_ungorocrater_01 achievement_zone_ungorocrater
          Arathi Basin|achievement_bg_winab achievement_bg_ab_kill_in_mine
          Feralas|achievement_zone_feralas
          Gurubashi Arena|achievement_arena_2v2_7 achievement_zone_stranglethorn_01 achievement_boss_hakkar
          Scarlet Monastery|achievement_dungeon_scarletmonastery inv_helmet_52 spell_holy_righteousfury
          Alterac Valley|achievement_bg_winav achievement_zone_alteracmountains_01
          Blackrock Mountain|achievement_zone_blackrock_01 achievement_boss_nefarion
          Gates of Ahn'Qiraj|achievement_zone_silithus_01 achievement_boss_cthun inv_misc_ahnqirajtrinket_01
          Naxxramas|achievement_dungeon_naxxramas_10man achievement_dungeon_naxxramas achievement_boss_kelthuzad_01
          Stranglethorn Vale|achievement_zone_stranglethorn_01
          Human|race_human_male achievement_character_human_male
          Dwarf|race_dwarf_male achievement_character_dwarf_male
          Night Elf|race_nightelf_male achievement_character_nightelf_male
          Gnome|race_gnome_male achievement_character_gnome_male
          Orc|race_orc_male achievement_character_orc_male
          Undead|race_scourge_male achievement_character_undead_male
          Tauren|race_tauren_male achievement_character_tauren_male
          Troll|race_troll_male achievement_character_troll_male
          LIST
          sed -i 's/^          //' cands.txt
          while IFS='|' read -r name list; do
            for icon in $list; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://wow.zamimg.com/images/wow/icons/large/$icon.jpg")
              echo "$name|$icon|$code" >> codes.txt
            done
          done < cands.txt
      - name: Keep it on the site-probe branch
        run: |
          cd /tmp/site
          git init -q -b site-probe && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "site probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:site-probe
