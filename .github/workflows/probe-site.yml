# Developer tool: fetches a few web addresses from a GitHub machine and keeps the answers on the private "site-probe"
# branch (this session's own network cannot reach them). Run by hand: Actions > Probe site > Run workflow.
name: Probe site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir -p /tmp/site && cd /tmp/site
          UA="Mozilla/5.0"
          get() { curl -sS -m 30 -A "$UA" -o "$1" -w "%{http_code} %{content_type} $2\n" "$2" >> codes.txt 2>&1 || echo "fail $2" >> codes.txt; }
          get npc-hogger.json "https://www.wowhead.com/classic/search/suggestions-template?q=Hogger"
          get npc-crusader.json "https://www.wowhead.com/classic/search/suggestions-template?q=Scarlet%20Crusader"
          get npc-tooltip.json "https://nether.wowhead.com/classic/tooltip/npc/448"
          for c in warrior paladin hunter rogue priest shaman mage warlock druid; do
            curl -s -o /dev/null -w "%{http_code} classicon_$c\n" "https://wow.zamimg.com/images/wow/icons/large/classicon_$c.jpg" >> codes.txt
          done
          for n in Butcher "Legion Gate" Titan "Titan's Grip" "Explosive Ammunition" "Explosive Shot" Radiance "Power Word: Radiance"; do
            f=$(echo "$n" | tr ' :' '__')
            curl -sS -m 30 -G -A "$UA" --data-urlencode "q=$n" -o "spell-retail-$f.json" "https://www.wowhead.com/search/suggestions-template" || true
            curl -sS -m 30 -G -A "$UA" --data-urlencode "q=$n" -o "spell-wotlk-$f.json" "https://www.wowhead.com/wotlk/search/suggestions-template" || true
          done
          get turtle-search.html "https://database.turtle-wow.org/?search=Butcher"
          get npc-page.html "https://www.wowhead.com/classic/npc=448/hogger"
          ls -la
      - name: Keep it on the site-probe branch
        run: |
          cd /tmp/site
          git init -q -b site-probe && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "site probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:site-probe
