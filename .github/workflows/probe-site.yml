# Developer tool: fetches a few web addresses from a GitHub machine and keeps the answers on the private "site-probe"
# branch (this session's own network cannot reach them). Run by hand: Actions > Probe site > Run workflow.
name: Probe site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir -p /tmp/site && cd /tmp/site
          for u in \
            https://wow.zamimg.com/modelviewer/classic/webthumbs/npc/128/384.webp \
            https://wow.zamimg.com/modelviewer/classic/webthumbs/npc/128/384.png \
            https://wow.zamimg.com/modelviewer/classic/webthumbs/npc/128/384.jpg \
            https://wow.zamimg.com/modelviewer/live/webthumbs/npc/128/384.webp \
            https://wow.zamimg.com/modelviewer/live/webthumbs/npc/128/384.png \
            https://wow.zamimg.com/modelviewer/wrath/webthumbs/npc/128/384.png \
            https://wow.zamimg.com/modelviewer/classic/webthumbs/npc/0/384.png ; do
            curl -s -o "$(echo $u | tr '/:' '__')" -w "%{http_code} %{content_type} %{size_download} $u\n" "$u" >> codes.txt
          done
          curl -sS -A "Mozilla/5.0" -o npc-crusader-page.html "https://www.wowhead.com/classic/npc=1660" -w "%{http_code} crusader page\n" >> codes.txt
          ls -la
      - name: Keep it on the site-probe branch
        run: |
          cd /tmp/site
          git init -q -b site-probe && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "site probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:site-probe
