# Developer tool: fetches a few web addresses from a GitHub machine and keeps the answers on the private "site-probe"
# branch (this session's own network cannot reach them). Run by hand: Actions > Probe site > Run workflow.
name: Probe site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir -p /tmp/site && cd /tmp/site
          curl -sS -m 30 -A "Mozilla/5.0" -o wowhead.txt -w '%{http_code}\n' "https://www.wowhead.com/classic/search/suggestions-template?q=Frostbolt" > codes.txt 2>&1 || true
          curl -sS -m 30 -A "Mozilla/5.0" -o nether.txt -w '%{http_code}\n' "https://nether.wowhead.com/classic/tooltip/spell/116" >> codes.txt 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o spellname.csv -w '%{http_code}\n' "https://wago.tools/db2/SpellName/csv?product=wow_classic_era" >> codes.txt 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o spellmisc.csv -w '%{http_code}\n' "https://wago.tools/db2/SpellMisc/csv?product=wow_classic_era" >> codes.txt 2>&1 || true
          ls -la; head -c 600 wowhead.txt; echo; head -c 600 nether.txt; echo; head -3 spellname.csv; head -3 spellmisc.csv
      - name: Keep it on the site-probe branch
        run: |
          cd /tmp/site
          git init -q -b site-probe && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "site probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:site-probe
