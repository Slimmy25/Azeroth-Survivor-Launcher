# Puts the New Player Guide's videos (folder guide-videos/, one folder per guide topic) on the "guide-videos"
# branch of the PUBLIC downloads repository. The launcher never downloads them: a video card opens the video
# streamed in the browser through the jsDelivr CDN, e.g.
#   https://cdn.jsdelivr.net/gh/Slimmy25/Azeroth-Survivor-Launcher-Releases@guide-videos/controls/how-do-i-open-the-dps-meter.mp4
# Each .mp4 can have a .jpg of the same name: the picture on its card. Keep each file under 20 MB (jsDelivr's limit).
# Needs the secret RELEASES_TOKEN (see build.yml). Runs by itself when guide-videos/ changes, or by hand.
name: Publish guide videos

on:
  push:
    branches: [main]
    paths: ['guide-videos/**', '.github/workflows/publish-guide-videos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push the videos to the public repository
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: Slimmy25/Azeroth-Survivor-Launcher-Releases
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::Set the RELEASES_TOKEN secret first (see build.yml)."; exit 1; fi
          big=$(find guide-videos -type f -size +20M)
          if [ -n "$big" ]; then echo "::error::Over jsDelivr's 20 MB limit: $big"; exit 1; fi
          mkdir /tmp/pub && cp -r guide-videos/. /tmp/pub/
          cat > /tmp/pub/README.md <<'EOF'
          # Azeroth Survivors guide videos
          Short how-to videos shown in the New Player Guide of the Azeroth Survivors Launcher, one folder per guide topic.
          The launcher streams them; nothing here needs to be downloaded.
          EOF
          sed -i 's/^          //' /tmp/pub/README.md
          cd /tmp/pub
          git init -q -b guide-videos
          git config user.name "guide-videos-bot"
          git config user.email "guide-videos-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Guide videos from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" HEAD:guide-videos
          # jsDelivr keeps a branch's files for a while: ask it to fetch the new ones now
          for f in $(git ls-files); do
            curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${PUBLIC_REPO}@guide-videos/$f" || true
          done
          git ls-files
