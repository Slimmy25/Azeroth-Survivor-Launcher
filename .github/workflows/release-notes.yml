# Updates a release's title and notes from release-notes/<tag>.md, without building or uploading anything.
# Actions > Release notes > Run workflow, and type the release's tag (v1.0, v1.1 ...).
name: Release notes

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release (v1.0, v1.1 ...)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -e
          notes="release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then echo "::error::$notes does not exist"; exit 1; fi
          title="Azeroth Survivors Launcher $TAG"
          gh release edit "$TAG" --title "$title" --notes-file "$notes"
