# Updates a release's title and notes from release-notes/<tag>.md, here and on the public downloads repository,
# without building or uploading anything (the exe stays the same, so no launcher downloads it again).
# Actions > Release notes > Run workflow, and type the release's tag (v1.0, v1.1 ...).
name: Release notes

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release (v1.0, v1.1 ...)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the notes
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: Slimmy25/Azeroth-Survivor-Launcher-Releases
          TAG: ${{ inputs.release }}
        run: |
          set -e
          notes="release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then echo "::error::$notes does not exist"; exit 1; fi
          title="Azeroth Survivors Launcher $TAG"
          gh release edit "$TAG" --title "$title" --notes-file "$notes"
          if [ -n "$PUBLIC_TOKEN" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release edit "$TAG" -R "$PUBLIC_REPO" --title "$title" --notes-file "$notes"
          fi
